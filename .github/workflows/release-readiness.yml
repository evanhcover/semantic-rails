name: Release Readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run pytest -q tests/semantic_rails tests/mf2sr -n auto
      - run: uv run python scripts/benchmark_plan.py --gate --output dist/agentic-governance-scorecard.json --markdown-output dist/agentic-governance-scorecard.md
      - run: uv run semantic-rails check --package jaffle_shop --artifact dist/jaffle_shop.semantic-rails.tar.gz
      - run: uv build --wheel
      - run: uv run python scripts/verify_package_distribution.py
      - run: uv run python scripts/verify_release_readiness.py
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/jaffle_shop.semantic-rails.tar.gz
            dist/*.whl
            dist/agentic-governance-scorecard.*
