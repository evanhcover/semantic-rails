name: Publish to PyPI

# Tag-triggered release: pushing a `v*` tag runs the full test suite, builds
# the sdist + wheel with `uv build`, and publishes via PyPI Trusted
# Publishing (OIDC) — no long-lived API token is stored in the repo.
#
# One-time setup on pypi.org: add a "trusted publisher" for the
# `semantic-rails` project pointing at this repo, workflow `publish.yml`,
# environment `pypi`; then create the matching `pypi` environment in the
# GitHub repo settings (optionally with required reviewers as a manual gate).
#
# Third-party actions are SHA-pinned (the trailing comment records the tag
# the SHA was resolved from).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --locked
      - run: uv run pytest -q tests/semantic_rails tests/mf2sr -n auto
      - run: uv run python scripts/verify_release_readiness.py

  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    environment: pypi
    permissions:
      # Job-level permissions replace the workflow defaults, so contents:read
      # must be restated here or actions/checkout cannot read the repo.
      contents: read
      # Required for PyPI Trusted Publishing (OIDC token exchange).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
